<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyron</title>
  <link id="favicon" rel="icon" href="./images/favicon.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E9DZ1KWKQT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-E9DZ1KWKQT');
  </script>

  <style>
    :root {
      --bg: #0a0a0c;
      --nav: rgba(20,20,23,0.9);
      --panel: #1a1a1e;
      --panel-2: #111114;
      --border: #27272a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #a855f7;
      --accent-soft: rgba(168,85,247,0.25);
      --hover: #1e1e22;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 99999;
      transition: opacity 0.45s ease;
    }

    .black-hole {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: black;
      box-shadow: 0 0 40px 12px var(--accent), inset 0 0 12px rgba(255,255,255,0.5);
      animation: breathe 3s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px 12px var(--accent), inset 0 0 12px rgba(255,255,255,0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 60px 20px var(--accent), inset 0 0 12px rgba(255,255,255,0.5); }
    }

    #top-ui {
      position: relative;
      z-index: 2;
    }

    .tab-strip {
      display: flex;
      align-items: end;
      gap: 4px;
      height: 42px;
      padding: 12px 14px 0 14px;
      background: var(--bg);
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 200px;
      min-width: 140px;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab.active {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    .tab-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-tab-btn {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 18px;
      opacity: 0.6;
      cursor: pointer;
    }

    .navbar {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 56px;
      padding: 0 20px;
      background: var(--nav);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: 0.2s ease;
    }

    .nav-button:hover {
      background: var(--hover);
      color: var(--accent);
    }

    .settings-icon-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      opacity: 0.7;
    }

    .search-container {
      flex: 1;
      height: 38px;
      display: flex;
      align-items: center;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
    }

    .search-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input#bar {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      font: inherit;
      padding: 8px 0;
    }

    .frame-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 98px;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }

    iframe.active {
      display: block;
    }

    .new-tab-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #171728 0%, var(--bg) 100%);
    }

    .new-tab-content {
      text-align: center;
    }

    .new-tab-content h1 {
      margin: 0;
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(to bottom, #fff, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .new-tab-content p {
      margin-top: 10px;
      letter-spacing: 2px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.78);
      z-index: 100000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.show { display: flex; }

    .modal-content {
      width: min(420px, calc(100vw - 30px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 22px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .modal-content h2 {
      margin: 0 0 16px;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 18px;
    }

    .section-label {
      display: block;
      margin: 18px 0 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
    }

    .setting-btn {
      width: 100%;
      margin: 4px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--hover);
      color: var(--text);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .setting-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .setting-btn.primary {
      background: var(--accent);
      border: none;
      color: white;
      font-size: 12px;
      padding: 14px;
    }

    .setting-btn.active-mode {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: white;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-row .setting-btn {
      flex: 1;
    }

    .custom-wisp-box {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .custom-wisp-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }

    .custom-wisp-input:focus {
      border-color: var(--accent);
    }

    .ping-tag {
      position: absolute;
      right: 10px;
      font-size: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="loading-screen"><div class="black-hole"></div></div>

  <div id="top-ui">
    <div class="tab-strip" id="tab-strip">
      <div class="nav-button" onclick="createNewTab()" style="font-size:24px;">+</div>
    </div>

    <nav class="navbar">
      <div class="nav-buttons">
        <div class="nav-button" onclick="goBack()">←</div>
        <div class="nav-button" onclick="goForward()">→</div>
        <div class="nav-button" onclick="reloadPage()">↻</div>
      </div>

      <div class="search-container">
        <input type="text" id="bar" placeholder="Search with Brave or enter URL" autocomplete="off" />
      </div>

      <div class="nav-buttons">
        <div class="nav-button" onclick="showSettings()">
          <img src="./images/settingsicon.png" class="settings-icon-img" alt="Settings" />
        </div>
        <div class="nav-button" onclick="toggleFullScreen()">⛶</div>
      </div>
    </nav>
  </div>

  <div class="frame-container" id="frame-container">
    <div id="new-tab-ui" class="new-tab-screen">
      <div class="new-tab-content">
        <h1>Zyron</h1>
        <p>Made by Arctic 1.0</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal" onclick="hideSettings()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2>Settings</h2>

      <span class="section-label">General</span>
      <button class="setting-btn primary" onclick="openAboutBlank()">Open in About:Blank</button>
      <button class="setting-btn" onclick="hideNavbar()">Hide Navigation Bar</button>
      <button id="cloak-toggle-btn" class="setting-btn" onclick="toggleCloaking()">Enable Tab Cloaking (Drive)</button>

      <span class="section-label">Static Mode</span>
      <div class="btn-row">
        <button id="runtime-default" class="setting-btn active-mode" onclick="setRuntimeMode('default')">Default</button>
        <button id="runtime-uv-static" class="setting-btn" onclick="setRuntimeMode('uv-static')">Ultraviolet Static</button>
      </div>

      <span class="section-label">Wisp Servers</span>
      <div style="display:flex; flex-direction:column; gap:0;">
        <button id="wisp-main" class="setting-btn active-mode" onclick="setWisp('main')">Main Server <span class="ping-tag" id="ping-main">--ms</span></button>
        <div class="btn-row">
          <button id="wisp-backup2" class="setting-btn" onclick="setWisp('backup2')">Backup 2 <span class="ping-tag" id="ping-backup2">--ms</span></button>
          <button id="wisp-backup3" class="setting-btn" onclick="setWisp('backup3')">Backup 3 <span class="ping-tag" id="ping-backup3">--ms</span></button>
        </div>
        <div class="btn-row">
          <button id="wisp-backup4" class="setting-btn" onclick="setWisp('backup4')">Backup 4 <span class="ping-tag" id="ping-backup4">--ms</span></button>
          <button id="wisp-backup5" class="setting-btn" onclick="setWisp('backup5')">Backup 5 <span class="ping-tag" id="ping-backup5">--ms</span></button>
        </div>
        <div class="btn-row">
          <button id="wisp-backup6" class="setting-btn" onclick="setWisp('backup6')">Backup 6 <span class="ping-tag" id="ping-backup6">--ms</span></button>
          <button id="wisp-backup7" class="setting-btn" onclick="setWisp('backup7')">Backup 7 <span class="ping-tag" id="ping-backup7">--ms</span></button>
        </div>
        <div class="btn-row">
          <button id="wisp-backup8" class="setting-btn" onclick="setWisp('backup8')">Backup 8 <span class="ping-tag" id="ping-backup8">--ms</span></button>
          <button id="wisp-backup9" class="setting-btn" onclick="setWisp('backup9')">Backup 9 <span class="ping-tag" id="ping-backup9">--ms</span></button>
        </div>
        <div class="btn-row">
          <button id="wisp-backup10" class="setting-btn" onclick="setWisp('backup10')">Backup 10 <span class="ping-tag" id="ping-backup10">--ms</span></button>
        </div>

        <div class="custom-wisp-box">
          <input type="text" id="custom-wisp-url" class="custom-wisp-input" placeholder="wss://your-wisp-server/wisp/" />
          <button class="setting-btn" style="margin:0; width:auto; padding:0 15px;" onclick="setCustomWisp()">Use</button>
        </div>
      </div>

      <button class="setting-btn" onclick="hideSettings()" style="margin-top: 20px; border:none; background:transparent; opacity:0.7; letter-spacing:0; text-transform:none;">Close</button>
    </div>
  </div>

  <script>
    const _d = (s) => atob(s);
    const wispUrls = {
      main: _d("d3NzOi8vZHl3aG1jd3AxeTk2bS5jbG91ZGZyb250Lm5ldC93aXNwLw=="),
      backup2: _d("d3NzOi8vd2lzcC5yaHcub25lLw=="),
      backup3: _d("d3NzOi8vaXhsbWF0aGxvZ2luLml4bC5iZXN0L3dpc3Av"),
      backup4: _d("d3NzOi8vczBsYWNlLWoybnAub25yZW5kZXIuY29tL3dpc3Av"),
      backup5: _d("d3NzOi8venlyb25nYXJkZW5pbmdhbG9yZS5zcGVlZGluc3VyZS5oay93aXNwLw=="),
      backup6: _d("d3NzOi8vZ2xzZXJpZXMubmV0L3dpc3Av"),
      backup7: _d("d3NzOi8vZ29pbnRvc3BhY2UuYXBwL3dpc3Av"),
      backup8: _d("d3NzOi8vZGFzaC5nb2lwLmRlL3dpc3Av"),
      backup9: _d("d3NzOi8vZGFzaC5nb2lwLmRlL3dpc3Av"),
      backup10: _d("d3NzOi8vd2lzcC50ZXJiaXVtb24udG9wL3dpc3Av")
    };

    let tabs = [];
    let activeTabId = null;
    let currentWisp = wispUrls.main;
    let runtimeMode = 'default';

    function updateCloakUI() {
      const isCloaked = localStorage.getItem('zyron-cloaked') === 'true';
      const btn = document.getElementById('cloak-toggle-btn');
      const favicon = document.getElementById('favicon');

      if (isCloaked) {
        document.title = 'My Drive - Google Drive';
        favicon.href = 'https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png';
        btn.innerText = 'Disable Tab Cloaking';
        btn.classList.add('active-mode');
      } else {
        document.title = 'Zyron';
        favicon.href = './images/favicon.png';
        btn.innerText = 'Enable Tab Cloaking (Drive)';
        btn.classList.remove('active-mode');
      }
    }

    function toggleCloaking() {
      const isCloaked = localStorage.getItem('zyron-cloaked') === 'true';
      localStorage.setItem('zyron-cloaked', String(!isCloaked));
      updateCloakUI();
    }

    function setRuntimeMode(mode) {
      runtimeMode = mode;
      document.querySelectorAll('.setting-btn.active-mode').forEach(btn => {
        if (btn.id === 'runtime-default' || btn.id === 'runtime-uv-static') btn.classList.remove('active-mode');
      });

      const targetBtn = document.getElementById(`runtime-${mode === 'default' ? 'default' : 'uv-static'}`);
      if (targetBtn) targetBtn.classList.add('active-mode');

      localStorage.setItem('zyron-runtime-mode', mode);
    }

    function loadRuntimeMode() {
      const saved = localStorage.getItem('zyron-runtime-mode') || 'default';
      setRuntimeMode(saved === 'uv-static' ? 'uv-static' : 'default');
    }

    function safeInitBareMux() {
      if (window.BareMux && window.BareMux.BareMuxConnection) {
        const connection = new window.BareMux.BareMuxConnection('./ixlmath/baremux/worker.js');
        connection.setTransport('./ixlmath/libcurl/index.mjs', [{ websocket: currentWisp }]);
        return connection;
      }
      return null;
    }

    let connection = safeInitBareMux();

    function initProxy() {
      if (connection) {
        connection.setTransport('./ixlmath/libcurl/index.mjs', [{ websocket: currentWisp }]);
      }
    }

    function safeLoadScramjet() {
      if (typeof window.$scramjetLoadController === 'function') {
        return window.$scramjetLoadController();
      }
      return {
        ScramjetController: class {
          constructor(config = {}) { this.config = config; }
          init() { return true; }
          encodeUrl(url) { return './ixlmath/go/' + btoa(url); }
          decodeUrl(value) { return atob(value); }
        }
      };
    }

    const { ScramjetController } = safeLoadScramjet();
    const scramjet = new ScramjetController({
      files: {
        all: './ixlmath/scram/scramjet.all.js',
        wasm: './ixlmath/scram/scramjet.wasm.wasm',
        sync: './ixlmath/scram/scramjet.sync.js'
      },
      prefix: './ixlmath/go/'
    });

    function loadWispSettings() {
      const savedWispKey = localStorage.getItem('zyron-wisp-key');
      const savedCustomWisp = localStorage.getItem('zyron-custom-wisp');

      if (savedCustomWisp) {
        currentWisp = savedCustomWisp;
        document.getElementById('custom-wisp-url').value = savedCustomWisp;
        document.querySelectorAll('.setting-btn').forEach(btn => {
          if (btn.id && btn.id.startsWith('wisp-')) btn.classList.remove('active-mode');
        });
      } else if (savedWispKey && wispUrls[savedWispKey]) {
        currentWisp = wispUrls[savedWispKey];
        document.querySelectorAll('.setting-btn').forEach(btn => {
          if (btn.id && btn.id.startsWith('wisp-')) btn.classList.remove('active-mode');
        });
        const btn = document.getElementById(`wisp-${savedWispKey}`);
        if (btn) btn.classList.add('active-mode');
      }
    }

    function setWisp(type) {
      currentWisp = wispUrls[type];
      localStorage.setItem('zyron-wisp-key', type);
      localStorage.removeItem('zyron-custom-wisp');

      document.querySelectorAll('.setting-btn').forEach(btn => {
        if (btn.id && btn.id.startsWith('wisp-')) btn.classList.remove('active-mode');
      });

      const btn = document.getElementById(`wisp-${type}`);
      if (btn) btn.classList.add('active-mode');

      initProxy();
    }

    function setCustomWisp() {
      const url = document.getElementById('custom-wisp-url').value.trim();
      if (!url.startsWith('ws')) {
        alert('failed to connect to custom wisp server url');
        return;
      }

      const socket = new WebSocket(url);
      const timeout = setTimeout(() => {
        socket.close();
        alert('failed to connect to custom wisp server url');
      }, 5000);

      socket.onopen = () => {
        clearTimeout(timeout);
        currentWisp = url;
        localStorage.setItem('zyron-custom-wisp', url);
        localStorage.removeItem('zyron-wisp-key');
        document.querySelectorAll('.setting-btn').forEach(btn => {
          if (btn.id && btn.id.startsWith('wisp-')) btn.classList.remove('active-mode');
        });
        initProxy();
        socket.close();
        alert('successfully connected to custom wisp server');
      };

      socket.onerror = () => {
        clearTimeout(timeout);
        alert('failed to connect to custom wisp server url');
      };
    }

    async function checkWispPing(url, elementId) {
      const start = Date.now();
      try {
        const socket = new WebSocket(url);
        const timeout = setTimeout(() => socket.close(), 3000);

        socket.onopen = () => {
          clearTimeout(timeout);
          const el = document.getElementById(elementId);
          if (el) el.innerText = (Date.now() - start) + 'ms';
          socket.close();
        };

        socket.onerror = () => {
          const el = document.getElementById(elementId);
          if (el) el.innerText = 'ERR';
          if (url === currentWisp) autoSwitch();
        };
      } catch (e) {
        const el = document.getElementById(elementId);
        if (el) el.innerText = 'ERR';
      }
    }

    function refreshAllPings() {
      Object.keys(wispUrls).forEach(key => {
        checkWispPing(wispUrls[key], `ping-${key}`);
      });
    }

    function autoSwitch() {
      for (const key of Object.keys(wispUrls)) {
        const el = document.getElementById(`ping-${key}`);
        if (!el) continue;
        const pingText = el.innerText;
        if (pingText !== 'ERR' && pingText !== '--ms') {
          setWisp(key);
          const bar = document.getElementById('bar');
          bar.placeholder = `AUTO-RECOVERY: Switched to ${key}`;
          setTimeout(() => { bar.placeholder = 'Search with Brave or enter URL'; }, 4000);
          return;
        }
      }
    }

    function showBH() {
      const loader = document.getElementById('loading-screen');
      loader.style.display = 'flex';
      loader.style.opacity = '1';
    }

    function hideBH() {
      const loader = document.getElementById('loading-screen');
      loader.style.opacity = '0';
      setTimeout(() => { loader.style.display = 'none'; }, 500);
    }

    function createNewTab() {
      const id = Date.now() + Math.random();
      tabs.push({ id, url: '', title: 'New Tab' });
      const frame = document.createElement('iframe');
      frame.id = `frame-${id}`;
      frame.onload = () => {
        const t = tabs.find(x => x.id === id);
        if (t) {
          renderTabs();
          hideBH();
        }
      };
      document.getElementById('frame-container').appendChild(frame);
      switchTab(id);
    }

    function switchTab(id) {
      activeTabId = id;
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      const frame = document.getElementById(`frame-${id}`);
      if (frame) frame.classList.add('active');
      const tab = tabs.find(t => t.id === id);
      const bar = document.getElementById('bar');
      bar.value = tab ? tab.url : '';
      const newTabUi = document.getElementById('new-tab-ui');
      newTabUi.style.display = frame && frame.src ? 'none' : 'flex';
      renderTabs();
    }

    function renderTabs() {
      const strip = document.getElementById('tab-strip');
      const addBtn = strip.querySelector('.nav-button');
      strip.querySelectorAll('.tab').forEach(t => t.remove());

      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
        el.innerHTML = `<span class="tab-title">${tab.title}</span><button class="close-tab-btn" onclick="closeTab(event, ${tab.id})">×</button>`;
        el.onclick = () => switchTab(tab.id);
        strip.insertBefore(el, addBtn);
      });
    }

    function loadUrlIntoCurrentTab(url) {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      tab.url = url;
      tab.title = url.split('/')[2] || url;
      const frame = document.getElementById(`frame-${activeTabId}`);
      if (!frame) return;

      if (runtimeMode === 'uv-static') {
        frame.src = `./uv-static/index.html?target=${encodeURIComponent(url)}`;
      } else if (scramjet && typeof scramjet.encodeUrl === 'function') {
        frame.src = scramjet.encodeUrl(url);
      } else {
        frame.src = url;
      }

      document.getElementById('new-tab-ui').style.display = 'none';
      renderTabs();
    }

    function nav() {
      const val = document.getElementById('bar').value.trim();
      if (!val) return;

      document.activeElement.blur();
      showBH();

      const url = (val.includes('.') && !val.includes(' '))
        ? (val.startsWith('http') ? val : 'https://' + val)
        : `https://search.brave.com/search?q=${encodeURIComponent(val)}`;

      loadUrlIntoCurrentTab(url);
    }

    function reloadPage() {
      const frame = document.getElementById(`frame-${activeTabId}`);
      if (!frame || !frame.src) return;
      showBH();
      try {
        frame.contentWindow.location.reload();
      } catch (e) {
        frame.src = frame.src;
      }
    }

    setInterval(() => {
      if (!activeTabId) return;
      const frame = document.getElementById(`frame-${activeTabId}`);
      if (!frame || !frame.src) return;
      try {
        const path = frame.contentWindow.location.pathname;
        if (path.includes('/ixlmath/go/')) {
          const encoded = path.split('/ixlmath/go/')[1];
          const decoded = typeof scramjet.decodeUrl === 'function' ? scramjet.decodeUrl(encoded) : atob(encoded);
          const tab = tabs.find(t => t.id === activeTabId);
          if (tab && tab.url !== decoded && document.activeElement !== document.getElementById('bar')) {
            tab.url = decoded;
            document.getElementById('bar').value = decoded;
          }
        }
      } catch (e) {}
    }, 1000);

    function hideNavbar() {
      document.body.classList.add('nav-hidden');
      hideSettings();
    }

    function openAboutBlank() {
      const win = window.open('about:blank', '_blank');
      if (!win) return;
      const doc = win.document;
      const iframe = doc.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.inset = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.src = window.location.href;
      doc.body.appendChild(iframe);
      if (localStorage.getItem('zyron-cloaked') === 'true') {
        doc.title = 'My Drive - Google Drive';
      } else {
        doc.title = 'Zyron';
      }
      window.location.replace('https://google.com');
    }

    function closeTab(e, id) {
      e.stopPropagation();
      if (tabs.length === 1) return;
      tabs = tabs.filter(t => t.id !== id);
      const frame = document.getElementById(`frame-${id}`);
      if (frame) frame.remove();
      if (activeTabId === id) activeTabId = tabs[0]?.id || null;
      renderTabs();
    }

    function showSettings() {
      document.getElementById('settings-modal').classList.add('show');
      refreshAllPings();
    }

    function hideSettings() {
      document.getElementById('settings-modal').classList.remove('show');
    }

    function goBack() {
      try {
        document.getElementById(`frame-${activeTabId}`).contentWindow.history.back();
      } catch (e) {}
    }

    function goForward() {
      try {
        document.getElementById(`frame-${activeTabId}`).contentWindow.history.forward();
      } catch (e) {}
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    setInterval(() => {
      if (!activeTabId) return;
      const currentKey = localStorage.getItem('zyron-wisp-key') || 'main';
      const pingId = `ping-${currentKey}`;
      const el = document.getElementById(pingId);
      if (el && el.innerText === '--ms') {
        checkWispPing(currentWisp, pingId);
      }
    }, 10000);

    window.onload = () => {
      updateCloakUI();
      loadRuntimeMode();
      loadWispSettings();
      initProxy();
      if (typeof scramjet.init === 'function') scramjet.init();
      createNewTab();
      refreshAllPings();
      setTimeout(hideBH, 1000);
    };

    document.getElementById('bar').onkeydown = (e) => {
      if (e.key === 'Enter') nav();
    };
  </script>
</body>
</html>
