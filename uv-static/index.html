<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultraviolet Static</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0c;
      color: #f8fafc;
      font-family: sans-serif;
    }
    .wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #171728, #0a0a0c 65%);
    }
    .card {
      width: min(90vw, 600px);
      padding: 32px 24px;
      border: 1px solid rgba(168,85,247,0.5);
      border-radius: 18px;
      background: rgba(17,17,20,0.9);
      box-shadow: 0 0 28px rgba(168,85,247,0.18);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      color: #d9b3ff;
    }
    p {
      margin: 0 0 20px;
      color: #cbd5e1;
    }
    button {
      background: #a855f7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Ultraviolet Static</h1>
      <p>Loading the target site...</p>
      <button onclick="goBack()">Back</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target');

    function goBack() {
      window.history.back();
    }

    if (target) {
      try {
        window.location.replace(target);
      } catch (error) {
        document.querySelector('p').textContent = 'Unable to redirect automatically.';
      }
    } else {
      document.querySelector('p').textContent = 'No target URL was provided.';
    }
  </script>
</body>
</html>
